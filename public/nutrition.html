<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="nutritionStyle2.css">

    <script src="main.js" type="module"></script>
</head>

<body>
    <div id="bg-image"></div>

    <nav class="navbar navbar-expand-lg bg-success-subtle">
        <div class="container-fluid">
            <header>
                <a class="navbar-brand nav-name" href="#">NutriTrack</a>
            </header>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active nav-button" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-button" href="#">Nutrition Search</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

<main class="container">
    <h1 id="titleHead" class="text-center">Nutrition Search</h1>
<p id="description"> Search for a food, then click on one of the results to see its nutritional info!</p>
    <div class="container">
        <div class="row">
        <div class="col">
            <form>
                <div class="mb-3">
                <label id="foodLabel" for="enterFood">Enter Food:</label>
                <input class="form-control" type="text" id="enterFood" placeholder="(e.g brown rice)">
                </div>
                <!--Portion selecting-->
                <div class="mb-3">
                <label for="portionSize" id="portionSizeLabel">Portion Size:</label>
                <input id="portionSize" type="number" placeholder="1">
                </div>
                <div class="mb-3">
                <label id="portionLabel" for="portion">Select Unit of Measurement</label>
                <select class="form-select" id="portion">
                    <option value="default">Select an option</option>
                    <option value="oz">ounce (oz)</option>
                    <option value="g">grams (g)</option>
                    <option value="cup">cup</option>
                    <option value="tbsp">tablespoon</option>
                </select>
                </div>
                <!--Search food button-->
                <button class="btn btn-success" id="searchFood" type="submit">Search Food</button>
            </form>
        </div>
        <div class="col" id="results">
            <h2 id="resultsHead">Food Results</h2>
            <!-- Food results list here-->
            <ul id="resultsList" class="list-group">

            </ul>
        </div>
        <!--Nutritional info-->
        <div class="col" id="foodInfo">
            <h3 id="foodInfoHead" class="text-center">Nutrition Summary</h3>
            <h4 class="text-center">(Per 100g)</h4>
            <ul id="nutritionInfo" class="list-group">

            </ul>
        </div>
    </div>
    </div>
</main>

    <footer class="text-center">
        <p>&copy;NutriTrack 2026. All rights reserved.</p>
    </footer>
</body>

</html>
