        <h1 class="text-center">Nutrition Search</h1>
        <p id="description"> <b id="descHere">Description:</b> <br> Search for a food, then click on one of the results to see its nutritional info!</p>



        <form>
            <label id="foodLabel" for="enterFood">Enter Food:</label>
            <input class="form-control" type="text" id="enterFood" placeholder="brown rice">


            <!--Portion selecting-->
            <label for="portionSize" id="portionSizeLabel">Portion Size:</label>
            <input id="portionSize" type="number" placeholder="10">

            <label id="portionLabel" for="portion">Select Unit of Measurement</label>
            <select class="form-select" id="portion">
                <option value="default">Select an option</option>
                <option value="oz">ounce (oz)</option>
                <option value="g">grams (g)</option>
                <option value="cup">cup</option>
                <option value="tbsp">tablespoon</option>
            </select>

            <!--Search food button-->
            <button class="btn btn-success" id="searchFood" type="submit">Search Food</button>

        </form>

        <!--Nutritional info-->
        <div id="foodInfo">
            <h3 id="foodInfoHead" class="text-center">Nutrition Summary</h3>
            <h4 class="text-center">(Per 100g)</h4>

                <li class="list-group-item">Lorem ipsum dolor sit amet.</li>
                <li class="list-group-item">Lorem ipsum dolor sit amet.</li>
